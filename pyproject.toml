[project]
name = "gyaradax"
authors = [{ name = "Gianluca Galletti" }, { name = "Eric Volkmann" }]
version = "0.0.1"
description = "Gyrokinetic Vlasov-Poisson solver in JAX"
requires-python = ">=3.12"
dependencies = [
  "jax",
  "numpy",
  "omegaconf",
  "einops",
  "matplotlib",
  "pillow",
  "scipy",
]

[project.scripts]
gyaradax = "gyaradax.cli:main"

[project.optional-dependencies]
cuda13 = ["jax[cuda13-local]", "nvidia-mathdx", "nvidia-nccl-cu13"]
dev = ["pytest", "ruff", "black"]
torax = ["torax @ git+https://github.com/google-deepmind/torax.git"]

[tool.setuptools.packages.find]
include = ["gyaradax*"]

# ship the bundled saturation-rule calibrations as package data
[tool.setuptools.package-data]
"gyaradax.quasilinear" = ["weights/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow-running"]
