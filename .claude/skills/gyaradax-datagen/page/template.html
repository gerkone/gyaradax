<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1d2330; --muted: #5d6677; --line: #dde1e8; --grid: #e9ecf1;
  --accent: #2456c4; --qi: #2456c4; --qe: #c2611f; --ref: #8b94a5; --ok: #2f7d4f; --cut: #c4254a;
  --drop: rgba(196, 37, 74, 0.10); --band: #e4edf1;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --panel: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2c323d; --grid: #252b35;
  --accent: #7ea2ff; --qi: #5a84e6; --qe: #c97a35; --ref: #6f7889; --ok: #6cc795; --cut: #ff5d7d;
  --drop: rgba(255, 93, 125, 0.13); --band: #1b282e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2c323d; --grid: #252b35;
  --accent: #7ea2ff; --qi: #5a84e6; --qe: #c97a35; --ref: #6f7889; --ok: #6cc795; --cut: #ff5d7d;
  --drop: rgba(255, 93, 125, 0.13); --band: #1b282e; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; margin: 0; }
.wrap { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); max-width: 1280px; margin: 0 auto; display: grid; gap: 26px; }
h1 { margin: 0; font-size: 1.5rem; } h2 { margin: 0; font-size: 1.15rem; } p { margin: 0; }
.muted { color: var(--muted); } .mono { font-family: var(--mono); }
section { display: grid; gap: 10px; }
.tablewrap { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; } th { color: var(--muted); font-weight: 600; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; border: 1px solid currentColor; color: var(--muted); }
.pill.running { color: var(--accent); } .pill.done, .pill.accept { color: var(--ok); } .pill.bad { color: var(--cut); }
.bar { position: relative; height: 6px; background: var(--grid); border-radius: 3px; min-width: 80px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.strips { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.plot, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 4px; min-width: 0; }
.plot svg, .card svg { display: block; width: 100%; height: auto; }
.ttl { font-size: 0.8rem; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.sw { display: inline-block; width: 18px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: middle; }
.card:not(.live) svg { cursor: crosshair; }
.head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.name { font: 600 1rem var(--mono); }
.facts { font: 0.78rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 600 0.8rem var(--sans); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button.primary { border-color: var(--cut); color: var(--cut); } button:disabled { opacity: 0.45; cursor: default; }
.banner { padding: 8px 12px; border: 1px solid var(--cut); border-radius: 6px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
</style>

<div class="wrap">
  <header style="display:grid;gap:6px"><h1>__TITLE__</h1><p class="muted mono" id="built"></p></header>
  <section>
    <h2>Parameters</h2>
    <p class="muted" id="cov-note"></p>
    <div class="plot"><div class="ttl" id="cov-title"></div><div id="cov"></div></div>
    <div class="strips" id="strips"></div>
    <div class="legend" id="cov-legend"></div>
  </section>
  <section>
    <h2>Progress</h2>
    <div class="tablewrap"><table id="t-status"></table></div>
  </section>
  <section>
    <h2 id="cut-title">Head cut</h2>
    <p class="muted" id="cut-note"></p>
    <div class="banner" id="banner" hidden>Decisions cannot be saved in this view. Open the artifact in claude.ai while signed in to record them.</div>
    <div class="grid2" id="cutter"></div>
  </section>
</div>

<script>
const D = /*DATA*/null;
const fmt = (x, d = 2) => x == null ? "–" : (Math.abs(x) >= 1e3 || (Math.abs(x) < 1e-2 && x !== 0)) ? x.toExponential(1) : x.toFixed(d);
const byName = Object.fromEntries(D.runs.map(r => [r.name, r]));
const live = r => r.state === "running";
const decisions = {}, choice = {};
let db = null;
D.runs.forEach(r => { choice[r.name] = r.proposal; });
document.getElementById("built").textContent = `built ${D.built}, ${D.runs.length} runs`;
const ST = { planned: "--muted", running: "--accent", done: "--ok", interrupted: "--qe", diverged: "--cut", banded: "--cut" };
const stateColor = s => `var(${ST[s] || "--cut"})`;

// parameter distributions: one 2D scatter (D.axes) and one strip per parameter, campaign over the existing dataset
function scatter() {
  const [kx, ky] = D.axes, W = 760, H = 300, m = { l: 52, r: 14, t: 10, b: 34 };
  const pts = D.existing.concat(D.runs.map(r => r.params));
  const rng = k => { const v = pts.map(p => p[k]).filter(Number.isFinite); const lo = Math.min(...v), hi = Math.max(...v), pad = (hi - lo || 1) * 0.05; return [lo - pad, hi + pad]; };
  const [x0, x1] = rng(kx), [y0, y1] = rng(ky);
  const sx = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), sy = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const xv = x0 + (x1 - x0) * i / 4, yv = y0 + (y1 - y0) * i / 4;
    g += `<line x1="${sx(xv)}" x2="${sx(xv)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/><text x="${sx(xv)}" y="${H - 16}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmt(xv)}</text>`;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(yv)}" y2="${sy(yv)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${sy(yv) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(yv)}</text>`;
  }
  g += `<text x="${W - m.r}" y="${H - 2}" text-anchor="end" font-size="11" fill="var(--muted)">${kx}</text><text x="${m.l}" y="${m.t + 2}" font-size="11" fill="var(--muted)">${ky}</text>`;
  D.existing.forEach(p => { g += `<circle cx="${sx(p[kx])}" cy="${sy(p[ky])}" r="2.4" fill="none" stroke="var(--ref)"/>`; });
  D.runs.forEach(r => { const c = stateColor(r.state); g += `<circle cx="${sx(r.params[kx])}" cy="${sy(r.params[ky])}" r="3.6" fill="${r.state === "planned" ? "none" : c}" stroke="${c}"><title>${r.name}</title></circle>`; });
  document.getElementById("cov-title").textContent = `${ky} against ${kx}`;
  document.getElementById("cov").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ky} against ${kx}">${g}</svg>`;
}

function strips() {
  const W = 300, H = 70, m = { l: 8, r: 8 };
  document.getElementById("strips").innerHTML = D.params.map(k => {
    const all = D.existing.map(p => p[k]).concat(D.runs.map(r => r.params[k])).filter(Number.isFinite);
    const lo = Math.min(...all), hi = Math.max(...all), sx = v => m.l + (v - lo) / (hi - lo || 1) * (W - m.l - m.r);
    const jit = i => ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1;
    let g = `<line x1="${m.l}" x2="${W - m.r}" y1="34" y2="34" stroke="var(--grid)"/>`;
    D.existing.forEach((p, i) => { if (Number.isFinite(p[k])) g += `<circle cx="${sx(p[k])}" cy="${10 + jit(i) * 20}" r="1.8" fill="none" stroke="var(--ref)"/>`; });
    D.runs.forEach((r, i) => { const c = stateColor(r.state); g += `<circle cx="${sx(r.params[k])}" cy="${40 + jit(i + 7) * 18}" r="3" fill="${r.state === "planned" ? "none" : c}" stroke="${c}"><title>${r.name}: ${fmt(r.params[k], 3)}</title></circle>`; });
    g += `<text x="${m.l}" y="${H - 1}" font-size="10" fill="var(--muted)">${fmt(lo)}</text><text x="${W - m.r}" y="${H - 1}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(hi)}</text>`;
    return `<div class="plot"><div class="ttl">${k}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="distribution of ${k}">${g}</svg></div>`;
  }).join("");
  document.getElementById("cov-legend").innerHTML = `<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ref);margin-right:4px;vertical-align:middle"></span>existing dataset (${D.existing.length})</span>` +
    Object.keys(ST).filter(s => D.runs.some(r => r.state === s)).map(s => `<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid ${stateColor(s)};background:${s === "planned" ? "none" : stateColor(s)};margin-right:4px;vertical-align:middle"></span>${s} (${D.runs.filter(r => r.state === s).length})</span>`).join("");
  document.getElementById("cov-note").textContent = `Existing points: ${D.existing_from || "none"}. Upper row of each strip: existing dataset; lower row: this campaign.`;
}

function cutStatus(r) {
  const d = decisions[r.name];
  if (r.stable) return `<span class="pill accept">stable, last frame kept</span>`;
  if (live(r)) return `<span class="pill">cut after the run</span>`;
  if (d?.status === "accept") return `<span class="pill accept">cut t ${fmt(d.cut, 1)}</span>`;
  if (d?.status === "keep") return `<span class="pill accept">keep all</span>`;
  return `<span class="pill">undecided</span>`;
}

function renderStatus() {
  document.getElementById("t-status").innerHTML = `<thead><tr><th>run</th>${D.params.map(k => `<th>${k}</th>`).join("")}<th>where</th><th>t / ${D.t_end}</th><th></th><th>frames</th><th>t / h</th><th>left</th><th>state</th>${D.eval ? "" : "<th>cut</th>"}</tr></thead><tbody>` +
    D.runs.map(r => {
      const cls = live(r) ? "running" : r.state === "done" ? "done" : r.state === "planned" || r.state === "interrupted" ? "" : "bad";
      const left = live(r) && r.rate ? `${((D.t_end - r.t_now) / r.rate).toFixed(1)} h` : "–";
      return `<tr><td class="mono">${r.name}</td>${D.params.map(k => `<td>${fmt(r.params[k], 3)}</td>`).join("")}<td class="mono">${r.where || "–"}</td><td>${fmt(r.t_now, 1)}</td><td><div class="bar"><i style="width:${Math.min(100, 100 * (r.t_now || 0) / D.t_end)}%"></i></div></td><td>${r.frames}</td><td>${fmt(r.rate, 1)}</td><td>${left}</td><td><span class="pill ${cls}">${r.stable ? "stable" : r.state}</span></td>${D.eval ? "" : `<td>${cutStatus(r)}</td>`}</tr>`;
    }).join("") + "</tbody>";
}

const CW = 560, CH = 190, PL = 44, PR = 10, PT = 8, PB = 24;
function trace(r) {
  const t1 = Math.max(D.t_end, r.t[r.t.length - 1] || 0);
  const ys = r.qi.concat(r.qe || []).filter(v => v > 0).map(Math.log10);
  const ymax = Math.ceil(Math.max(...ys, 0)), ymin = Math.max(Math.floor(Math.min(...ys, -1)), ymax - 10);
  const sx = t => PL + t / t1 * (CW - PL - PR);
  const sy = v => PT + (ymax - Math.min(Math.max(Math.log10(Math.max(v, 1e-300)), ymin), ymax)) / (ymax - ymin || 1) * (CH - PT - PB);
  const path = a => r.t.map((t, i) => `${i ? "L" : "M"}${sx(t).toFixed(1)},${sy(a[i]).toFixed(1)}`).join("");
  const cut = D.eval ? null : choice[r.name], f0 = r.frame_t[0], f1 = r.frame_t[r.frame_t.length - 1];
  let s = `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Heat flux of ${r.name}">`;
  if (!D.eval && r.frame_t.length) s += `<rect x="${sx(f0)}" y="${PT}" width="${Math.max(sx(f1) - sx(f0), 1)}" height="${CH - PT - PB}" fill="var(--band)"/>`;
  if (cut != null) s += `<rect x="${sx(f0)}" y="${PT}" width="${Math.max(sx(cut) - sx(f0), 0)}" height="${CH - PT - PB}" fill="var(--drop)"/>`;
  for (let e = ymin; e <= ymax; e += Math.max(1, Math.ceil((ymax - ymin) / 5))) s += `<line x1="${PL}" x2="${CW - PR}" y1="${sy(10 ** e)}" y2="${sy(10 ** e)}" stroke="var(--grid)"/><text x="${PL - 5}" y="${sy(10 ** e) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">1e${e}</text>`;
  for (let t = 0; t <= t1; t += 100) s += `<text x="${sx(t)}" y="${CH - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${t}</text>`;
  if (r.sat_qi > 0) s += `<line x1="${PL}" x2="${CW - PR}" y1="${sy(r.sat_qi)}" y2="${sy(r.sat_qi)}" stroke="var(--muted)" stroke-dasharray="1 3"/>`;
  if (r.qe) s += `<path d="${path(r.qe)}" fill="none" stroke="var(--qe)" stroke-width="1.2"/>`;
  s += `<path d="${path(r.qi)}" fill="none" stroke="var(--qi)" stroke-width="1.6"/>`;
  if (r.proposal != null && !D.eval) s += `<line x1="${sx(r.proposal)}" x2="${sx(r.proposal)}" y1="${PT}" y2="${CH - PB}" stroke="var(--cut)" stroke-dasharray="3 3"/>`;
  if (cut != null) s += `<line x1="${sx(cut)}" x2="${sx(cut)}" y1="${PT}" y2="${CH - PB}" stroke="var(--cut)" stroke-width="1.8"/>`;
  return s + `</svg>`;
}

const legend = r => `<div class="legend"><span><span class="sw" style="border-color:var(--qi)"></span>Q<sub>i</sub></span>${r.qe ? '<span><span class="sw" style="border-color:var(--qe)"></span>Q<sub>e</sub></span>' : ""}${D.eval ? "" : '<span><span class="sw" style="border-color:var(--cut)"></span>cut</span>'}</div>`;
function card(r) {
  const cut = choice[r.name], n = cut == null ? 0 : r.frame_t.filter(t => t < cut - 1e-6).length;
  const what = r.stable ? `stable at t ${fmt(r.t_now, 1)}, last frame kept` : live(r) ? `t ${fmt(r.t_now, 1)} of ${D.t_end}` :
    cut == null ? `keeps all ${r.frame_t.length} frames` : `cut at t ${fmt(cut, 1)} drops ${n} of ${r.frame_t.length} frames`;
  const dis = live(r) || r.stable || !r.frame_t.length ? "disabled" : "";
  return `<div class="card ${live(r) ? "live" : ""}" data-name="${r.name}"><div class="head"><span class="name">${r.name}</span>${cutStatus(r)}</div>${legend(r)}${trace(r)}
    <div class="facts">${what}</div>
    <div class="actions"><button class="primary" data-act="accept" ${dis || (cut == null ? "disabled" : "")}>Accept cut</button><button data-act="keep" ${dis}>Keep all</button><button data-act="reset" ${dis}>Back to proposal</button></div></div>`;
}
function traceCard(r) {
  const what = live(r) ? `t ${fmt(r.t_now, 1)} of ${D.t_end}` : `${r.stable ? "stable" : r.state} at t ${fmt(r.t_now, 1)}` +
    (r.state === "done" ? `, Q<sub>i</sub> ${fmt(r.qi_late)}${r.qe ? `, Q<sub>e</sub> ${fmt(r.qe_late)}` : ""} over the last 30%` : "");
  return `<div class="card" data-name="${r.name}"><div class="head"><span class="name">${r.name}</span></div>${legend(r)}${trace(r)}<div class="facts">${what}</div></div>`;
}

function render() {
  renderStatus();
  const shown = D.runs.filter(r => r.t.length);
  document.getElementById("cut-title").textContent = D.eval ? "Flux traces" : "Head cut";
  document.getElementById("cut-note").textContent = D.eval ? "Evaluation campaign: no frames are cut." :
    "Dashed line: proposed cut, the first frame where the 5-frame mean of Q_i reaches its mean over the last 30 %. Click the plot to move the cut, then accept; decisions are saved in this page's database (collection cuts).";
  document.getElementById("cutter").innerHTML = shown.map(D.eval ? traceCard : card).join("");
}

async function save(name, body) {
  decisions[name] = body; render();
  if (!db) { document.getElementById("banner").hidden = false; return; }
  try { await db.collection("cuts").doc(name).set(body); } catch (e) { document.getElementById("banner").hidden = false; }
}

document.getElementById("cutter").addEventListener("click", ev => {
  const el = ev.target.closest(".card"); if (!el || D.eval) return;
  const r = byName[el.dataset.name]; if (live(r) || r.stable || !r.frame_t.length) return;
  const btn = ev.target.closest("button");
  if (btn) {
    const act = btn.dataset.act, at = new Date().toISOString();
    if (act === "accept" && choice[r.name] != null) save(r.name, { status: "accept", cut: choice[r.name], at });
    if (act === "keep") { choice[r.name] = null; save(r.name, { status: "keep", cut: null, at }); }
    if (act === "reset") { choice[r.name] = r.proposal; render(); }
    return;
  }
  const svg = ev.target.closest("svg"); if (!svg) return;
  const b = svg.getBoundingClientRect(), x = (ev.clientX - b.left) / b.width * CW;
  const t = (x - PL) / (CW - PL - PR) * Math.max(D.t_end, r.t[r.t.length - 1]);
  choice[r.name] = t <= r.frame_t[0] ? null : (r.frame_t.find(f => f >= t - 1e-6) ?? r.frame_t[r.frame_t.length - 1]);
  render();
});

scatter(); strips(); render();
(async () => {
  if (D.eval) return;
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) return;
  db.collection("cuts").onSnapshot(snap => {
    for (const d of snap.docs) if (byName[d.id]) {
      const b = d.data(); decisions[d.id] = b;
      if (b.status === "accept" && b.cut != null) choice[d.id] = b.cut;
      if (b.status === "keep") choice[d.id] = null;
    }
    render();
  }, () => { document.getElementById("banner").hidden = false; });
})();
</script>
